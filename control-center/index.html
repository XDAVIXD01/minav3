<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de MINA V3</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      color: #f7f9ff; background: #0c101a url("assets/mina-background.png") center center / cover no-repeat;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: linear-gradient(110deg, rgba(8,12,22,.94) 0%, rgba(12,16,28,.82) 48%, rgba(12,16,28,.45) 100%);
      backdrop-filter: blur(1px);
    }
    .shell { position: relative; width: min(720px, calc(100vw - 70px)); }
    .brand { display: flex; align-items: center; gap: 18px; margin: 0 0 22px 4px; }
    .avatar { width: 78px; height: 78px; border-radius: 24px; object-fit: cover; box-shadow: 0 12px 40px rgba(0,0,0,.42); border: 2px solid rgba(255,255,255,.28); }
    .eyebrow { color: #aeb9d8; font-size: 12px; font-weight: 800; letter-spacing: .21em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: 34px; letter-spacing: -.035em; }
    .card {
      padding: 28px; border-radius: 26px; background: rgba(18,23,36,.86);
      border: 1px solid rgba(255,255,255,.13); box-shadow: 0 28px 80px rgba(0,0,0,.42);
      backdrop-filter: blur(18px);
    }
    .status { display: flex; align-items: center; gap: 15px; padding: 16px 18px; border-radius: 16px; background: rgba(255,255,255,.065); }
    .status-dot { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto; transition: .25s ease; }
    .status-dot.online { background: #3ee59a; box-shadow: 0 0 0 7px rgba(62,229,154,.11), 0 0 22px #3ee59a; }
    .status-dot.offline { background: #ff6474; box-shadow: 0 0 0 7px rgba(255,100,116,.1); }
    #status-text { font-size: 17px; font-weight: 750; }
    #status-detail { margin-top: 3px; color: #aab4cd; font-size: 13px; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-top: 22px; }
    button {
      min-height: 57px; border: 0; border-radius: 15px; color: white; font: inherit; font-weight: 800;
      cursor: pointer; transition: transform .15s ease, filter .15s ease, opacity .15s ease; box-shadow: 0 10px 25px rgba(0,0,0,.22);
    }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .36; cursor: default; box-shadow: none; }
    #start { background: linear-gradient(135deg, #1ebd79, #168e65); }
    #stop { background: linear-gradient(135deg, #df4c61, #aa2945); }
    #restart { background: linear-gradient(135deg, #756aff, #5946dd); }
    .icon { font-size: 17px; margin-right: 7px; }
    #feedback { min-height: 20px; margin: 18px 4px 0; color: #cbd3e8; font-size: 13px; }
    #error-box { margin-top: 10px; max-height: 76px; overflow: hidden; white-space: pre-wrap; padding: 10px 12px; border-radius: 10px; background: rgba(152,30,54,.25); color: #ffc2cd; font: 11px/1.35 Consolas, monospace; }
    .notice { margin: 14px 4px 0; color: #8f99b2; font-size: 11px; }
    body.working .status-dot { animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.35); opacity: .65; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="avatar" src="assets/mina-icon.png" alt="MINA V3">
      <div><div class="eyebrow">Discord · Voz IA</div><h1>Control de MINA V3</h1></div>
    </header>
    <section class="card">
      <div class="status">
        <span id="status-dot" class="status-dot offline"></span>
        <div><div id="status-text">Comprobando MINA V3…</div><div id="status-detail">Leyendo el estado del proceso</div></div>
      </div>
      <div class="buttons">
        <button id="start"><span class="icon">▶</span>Encender</button>
        <button id="stop"><span class="icon">■</span>Apagar</button>
        <button id="restart"><span class="icon">↻</span>Reiniciar</button>
      </div>
      <div id="feedback"></div>
      <pre id="error-box" hidden></pre>
      <div class="notice">Cierra el panel cuando quieras: la voz continúa activa hasta que pulses Apagar.</div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
